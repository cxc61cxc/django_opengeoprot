<div id="map" ></div>


<script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
  <script>
    var map = L.map('map').setView([{{ pratica.posizione.y }}, {{ pratica.posizione.x }}], 18);
    // L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    //         setZoom: 18,
    //     }, {
    //   attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    // }).addTo(map);
    L.tileLayer('http://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png', {
                  attribution: 'Map data &copy; <a href="https://www.openstreetmap.org/">OpenStreetMap</a>',
                  maxZoom: 20
                  }).addTo(map);


    {% if pratica.posizione %}
      var marker = L.marker([{{ pratica.posizione.y }}, {{ pratica.posizione.x }}]).addTo(map)
      .bindPopup('Pratica {{ pratica.prot_gen }}/{{ pratica.data_prot_gen.year }}').openPopup();
      map.setView([{{ pratica.posizione.y }}, {{ pratica.posizione.x }}], 17);
    {% endif %}
  </script>
