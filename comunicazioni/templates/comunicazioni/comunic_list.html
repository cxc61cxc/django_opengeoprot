{% extends 'base.html' %}


{% load static %}
{% block content %}
    <div class="container">
            <table class="table">
                <thead>
                <tr>
                    
                    <th colspan="2">Modelli</th>
                    
                </tr>
                </thead>
                <tbody>
                {% for modello in modelli %}
                    <tr>
                        <td class="col-1">
                            {{ modello.id }}                            
                        </td>
                        <td class="col-3">
                            
                                {{ modello.name }}
                                
                        </td>
                        <td class="col-1">
                            {{ modello.description }}                            
                        </td>
                        <td class="col-1">
                            {{ modello.tipo_pratica_id }} - {{ modello.tipo_pratica }}                            
                        </td>
                    </tr>
                    {% endfor %}
                
                
                </tbody>
            </table>
    </div>
{% endblock %}
