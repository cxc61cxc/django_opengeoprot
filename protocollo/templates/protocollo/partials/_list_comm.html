{% load static %}

  <div class="row">
    
    
    {% if tot_comm %} 
      <!-- Se è presente almeno un cdu NON mostra il tasto aggiungi -->
    {% else %}
        <div class="col-sm-5">
          <a style="color:green;" class="nav-link " href="#"><img class="img-fluid" 
            src="{% static 'img/icons8-plus.svg' %}" 
            width="25" height="25" >
          </a>
        </div>
    {% endif %}
        
        
    
  </div>    

  <!-- {% if cdu %}  -->
  {% if tot_comm %} 
  <table class="table table-hover table-sm" style="font-size:.9em;">
            
    <thead>
      <tr class="text-muted" style="font-size:.9em;">
        
        <!-- <th scope="col">#</th> -->
        <th scope="col">#</th>
        <th scope="col">Numero</th>
        <th scope="col">Data</th>
        
      
      </tr>
    </thead>
  <!-- {% endif %}  -->

    <tbody>
      {% for c in commissioni %}
      <tr style="vertical-align:bottom;">
        <!-- <th scope="row">
          <a title="Vai alla Commissione" class="btn btn-outline-info btn-sm" style="height:20px; width:20px;" href="#">
          
          </a>
        </th> -->
        <td>
          COMMISSIONI
        </td>
      
        <td style="font-size:1.1em">
          {{ c.num_commissione }}
        </td>
        
        <td>{{ c.data_commissione| date:"d/m/Y"  }}</td>

        <td>
          <a title="Modifica dati della commissione" class="btn btn-warning btn-sm" style="height:20px; width:20px;" href="#"></a>
        </td>
      </tr>
      
    </tbody>
  {% endfor %}
  </table>
{% endif %}
