{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container">

    <div class="row">
        <h5>Aggiungi Tipo di pratica</h5>
    </div>

    <div class="container p-2 my-2 border" style="font-size:0.9em;">

        <form method="POST" enctype="multipart/form-data">
        
            <!-- Security token -->
            {% csrf_token %}

            <!-- Using the formset -->
            <div class="row">
                

                <div class="form-group col-md-3 mb-2" id="name" >
                    <label>Sigla</label>
                    <input type="text" class="form-control" autofocus name="name" required placeholder="Inserisci il codice pratica"> 
                    <!-- {{ form.name  | as_crispy_field  }} -->
                </div>         
                
                <div class="form-group col-md-9 mb-2">
                    <label>Descrizione estesa</label>

                    <input type="text" class="form-control"  name="description" required placeholder="Inserisci la descrizione estesa"> 
                </div>
                
            </div>  
                
                
            <div class="row justify-content-end">
                <div class="form-group col-md-1 mb-0 ">
                    <input type="submit" value="Salva" class="btn btn-info">
                </div>
            </div>
              
        </form>

    </div>
</div>
{% endblock %}
