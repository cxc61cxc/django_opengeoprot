{% extends 'base.html' %}

{% block title %}Elimina Attivita U.O.{% endblock %}

{% block content %}
<div class="container mt-4" style="max-width: 600px;">
  <div class="card border-danger shadow-sm">
    <div class="card-header bg-danger text-white">Elimina Attivita U.O.</div>
    <div class="card-body">
      <p>Sei sicuro di voler eliminare <strong>{{ attivita.nome }}</strong> ({{ attivita.servizio.codice }} / {{ attivita.servizio.settore.codice }})?</p>
      <form method="post">
        {% csrf_token %}
        <div class="text-right">
          <a href="{% url 'struttura_ente:settore_list' %}" class="btn btn-outline-secondary">Annulla</a>
          <button type="submit" class="btn btn-danger">Elimina</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
