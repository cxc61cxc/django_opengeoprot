{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Cambia Password{% endblock %}

{% block content %}
<div class="container mt-4">
  <nav aria-label="breadcrumb" class="mb-3">
    <ol class="breadcrumb bg-white px-0 py-2 mb-0">
      <li class="breadcrumb-item"><a href="{% url 'home:index' %}">Home</a></li>
      <li class="breadcrumb-item"><a href="{% url 'accounts:profile_view_url' %}">Il mio profilo</a></li>
      <li class="breadcrumb-item active" aria-current="page">Cambia Password</li>
    </ol>
  </nav>

  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow-sm">
        <div class="card-header bg-light">
          <h4 class="mb-0"><i class="fa fa-key me-2"></i>Cambia Password</h4>
        </div>
        <div class="card-body">
          <form method="post">
            {% csrf_token %}
            {{ form|crispy }}
            <div class="d-flex justify-content-between mt-3">
              <a href="{% url 'accounts:profile_view_url' %}" class="btn btn-outline-secondary">Annulla</a>
              <button type="submit" class="btn btn-primary">
                <i class="fa fa-save me-1"></i> Aggiorna Password
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
