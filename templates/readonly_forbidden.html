{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="alert alert-warning" role="alert">
                <h4 class="alert-heading">Accesso in sola lettura</h4>
                <p>{{ message }}</p>
                <hr>
                <p class="mb-0">
                    Il tuo account appartiene a un gruppo di sola lettura
                    ({{ gruppi }}), pertanto non è consentito modificare,
                    aggiungere o eliminare i dati.
                </p>
            </div>
            <div class="text-center">
                <a href="{% url 'home:index' %}" class="btn btn-primary">Torna alla home</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
