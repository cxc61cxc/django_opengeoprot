{% extends 'base.html' %}
{% block content %}
<div class="container-fluid">
    <h3>Grafo delle Relazioni</h3>
    <div id="mynetwork" style="width: 100%; height: 600px; border: 1px solid lightgray; background-color: #f8f9fa;"></div>
</div>

<!-- Import Vis.js -->
<script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>

<script type="text/javascript">
    const container = document.getElementById('mynetwork');
    
    // Recupera l'eventuale parametro pratica_id dalla URL della pagina corrente
    const urlParams = new URLSearchParams(window.location.search);
    const praticaId = urlParams.get('pratica_id') || "";

    fetch(`{% url 'protocollo:graph_relazioni_data_url' %}?pratica_id=${praticaId}`)
        .then(response => response.json())
        .then(data => {
            const options = {
                nodes: {
                    font: { size: 14, color: '#343a40' },
                    borderWidth: 2
                },
                edges: {
                    width: 2,
                    color: { inherit: 'from' },
                    smooth: { type: 'continuous' }
                },
                physics: {
                    enabled: true,
                    barnesHut: { gravitationalConstant: -2000, centralGravity: 0.3, springLength: 95 }
                },
                interaction: { hover: true, navigationButtons: true }
            };

            const network = new vis.Network(container, data, options);

            // Navigazione al click
            network.on("doubleClick", function (params) {
                if (params.nodes.length > 0) {
                    const nodeId = params.nodes[0];
                    if (nodeId.startsWith('p_')) {
                        const id = nodeId.split('_')[1];
                        window.location.href = `/protocollo/pratica_detail/${id}/`;
                    } else if (nodeId.startsWith('s_')) {
                        const id = nodeId.split('_')[1];
                        window.location.href = `/protocollo/soggetto_edit/${id}/`;
                    } else if (nodeId.startsWith('parc_')) {
                        const id = nodeId.split('_')[1];
                        window.location.href = `/protocollo/particella_pratica_detail/${id}/`;
                    }
                }
            });
        });
</script>
{% endblock %}
