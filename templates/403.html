{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="alert alert-warning" role="alert">
        <h4 class="alert-heading"><i class="fa fa-exclamation-triangle"></i> Accesso negato</h4>
        <p>Non hai i permessi per visualizzare questa pagina.</p>
        <hr>
        {% if next_url %}
        <a href="{{ next_url }}" class="btn btn-primary">Torna alla pagina precedente</a>
        {% else %}
        <button class="btn btn-primary" onclick="history.back()">Torna indietro</button>
        {% endif %}
        <a href="{% url 'home:index' %}" class="btn btn-secondary">Vai alla Home</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
