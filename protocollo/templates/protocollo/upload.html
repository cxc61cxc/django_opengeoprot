{% extends 'base.html' %}
{% load crispy_forms_tags %}
{{ pk }}
{% block content %}
<div class="container p-2 my-2 border" style="font-size:0.9em;">
  <div class="row">
    <div class="col-3">
      <!-- <a href="{% url 'protocollo:index_pratiche_url' %}" 
            style="color:white;" class="btn btn-sm btn-info" >
            Indietro
      </a> -->
      <input type=button class="btn btn-success btn-sm" value="Indietro" onClick="javascript:history.go(-1);">
    </div> 
  </div>
  <form method="post" enctype="multipart/form-data" action="">
    {% csrf_token %}
    
    <div class="form-row my-2">
      
      <div class="form-group col-md-2 mb-0" >
        {{ form.posta | as_crispy_field }}
      </div>
      
      <div class="form-group col-md-2 mb-0" >
        {{ form.document | as_crispy_field }}
      </div>
      <div class="form-group col-md-2 mb-0" >
        {{ form.prot | as_crispy_field }}
      </div>
      <div class="form-group col-md-2 mb-0" >
        {{ form.data_prot | as_crispy_field }}
      </div>
      
    </div>
    <div class="form-row my-2">
      <div class="form-group col-md-6 offset-2 mb-0">
        {{form.name | as_crispy_field}}
      </div>
    </div>
    <div class="form-row">
      <div class="d-flex ">
        <div class="p-2"><input class="btn btn-outline-info" type="submit" value="upload" /></div>
      </div>
    </div>
  
  </form>
</div>
{% endblock %}
