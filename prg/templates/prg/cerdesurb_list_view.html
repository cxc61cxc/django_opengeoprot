{% load static %}
<div class="row">
  <small>Certificato di Destinazione urbanistica - pratica {{ pk }}</small>
</div>
<div class="row">
  {% if vedi %}
  <div class="m-0"><a style="color:green;" class="nav-link " href="#"><img class="img-fluid" 
    src="{% static 'img/icons8-plus.svg' %}" 
    width="25" height="25" >Aggiungi/Edita cdu</a>
  </div>
  {% else %}
  kjalhaigahfa
  {% endif %}
</div>    

{% if cdu %} 
    <table class="table table-hover table-sm" style="font-size:.9em;">
          
      <thead>
        <tr class="text-muted" style="font-size:.9em;">
          <th scope="col">#</th>
          <th scope="col">Numero</th>
          <th scope="col">Data</th>
          
         
        </tr>
      </thead>
     
      <tbody>
        {% for c in particelle %}
        <tr style="vertical-align:bottom;">
          <th scope="row">{{ c.id }}</th>
         
          <td style="font-size:1.1em">
            {{ c.cdu_number }}
          </td>
          
          <td>{{ c.cdu_date| date:"d/m/Y"  }}</td>

          
        </tr>
        {% endfor %}
      </tbody>

    </table>
    {% endif %}
